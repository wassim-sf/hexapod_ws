# Gazebo to ROS 2. The /joint_commands path is pure ROS: it goes straight to the controller.
- {ros_topic_name: clock, gz_topic_name: clock, ros_type_name: rosgraph_msgs/msg/Clock, gz_type_name: gz.msgs.Clock, direction: GZ_TO_ROS}
- {ros_topic_name: imu/data, gz_topic_name: imu, ros_type_name: sensor_msgs/msg/Imu, gz_type_name: gz.msgs.IMU, direction: GZ_TO_ROS}
- {ros_topic_name: ground_truth/odom, gz_topic_name: ground_truth/odom, ros_type_name: nav_msgs/msg/Odometry, gz_type_name: gz.msgs.Odometry, direction: GZ_TO_ROS}
- {ros_topic_name: foot_contact_raw/leg_1, gz_topic_name: foot_contact_raw/leg_1, ros_type_name: ros_gz_interfaces/msg/Contacts, gz_type_name: gz.msgs.Contacts, direction: GZ_TO_ROS}
- {ros_topic_name: foot_contact_raw/leg_2, gz_topic_name: foot_contact_raw/leg_2, ros_type_name: ros_gz_interfaces/msg/Contacts, gz_type_name: gz.msgs.Contacts, direction: GZ_TO_ROS}
- {ros_topic_name: foot_contact_raw/leg_3, gz_topic_name: foot_contact_raw/leg_3, ros_type_name: ros_gz_interfaces/msg/Contacts, gz_type_name: gz.msgs.Contacts, direction: GZ_TO_ROS}
- {ros_topic_name: foot_contact_raw/leg_4, gz_topic_name: foot_contact_raw/leg_4, ros_type_name: ros_gz_interfaces/msg/Contacts, gz_type_name: gz.msgs.Contacts, direction: GZ_TO_ROS}
- {ros_topic_name: foot_contact_raw/leg_5, gz_topic_name: foot_contact_raw/leg_5, ros_type_name: ros_gz_interfaces/msg/Contacts, gz_type_name: gz.msgs.Contacts, direction: GZ_TO_ROS}
- {ros_topic_name: foot_contact_raw/leg_6, gz_topic_name: foot_contact_raw/leg_6, ros_type_name: ros_gz_interfaces/msg/Contacts, gz_type_name: gz.msgs.Contacts, direction: GZ_TO_ROS}
