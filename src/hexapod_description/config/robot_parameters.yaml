# Single source of truth for the hexapod model: hexapod_description, the kinematics library and the RL environment.
# Generated by scripts/generate_model.py. Provenance of every number: docs/robot_parameters.md.

# MakeYourPet hexapod with the Robot Lk part selection. SI units, radians.
robot: {name: hexapod, variant: makeyourpet_chipo_femur_long_tibia, source: github.com/MakeYourPet/hexapod 7d8fc80 (MIT)}

# Visual meshes generated by scripts/generate_model.py from the MIT parts. Servos are placeholder boxes.
visual: {mesh_subdir: makeyourpet, servo_model: placeholder_from_datasheet}

# MEASURED from STL. base_link: x forward, y left, z up, origin at the body centre on the frame underside.
body: {hip_z: 0.00325, frame_thickness: 0.016, across_x: 0.2054, across_y: 0.198, body_bottom_z: -0.042, top_cover_z: 0.0282}

# MEASURED from STL. Published config: COXA_LEN 43; Chipo FEMUR_LEN 60; main TIBIA_LEN 134.
leg_geometry: {coxa_length: 0.043, femur_length: 0.06, tibia_length: 0.133145}

# Leg order as in earlier steps: right front to rear, then left. mirror: right +1, left -1.
legs:
- {id: 1, name: front_right, side: right, mirror: 1, yaw: -0.785398, yaw_deg: -45.0, x: 0.083148, y: -0.062948}
- {id: 2, name: center_right, side: right, mirror: 1, yaw: -1.570796, yaw_deg: -90.0, x: 0.0, y: -0.08175}
- {id: 3, name: rear_right, side: right, mirror: 1, yaw: -2.356194, yaw_deg: -135.0, x: -0.083148, y: -0.062948}
- {id: 4, name: front_left, side: left, mirror: -1, yaw: 0.785398, yaw_deg: 45.0, x: 0.083148, y: 0.062948}
- {id: 5, name: center_left, side: left, mirror: -1, yaw: 1.570796, yaw_deg: 90.0, x: 0.0, y: 0.08175}
- {id: 6, name: rear_left, side: left, mirror: -1, yaw: 2.356194, yaw_deg: 135.0, x: -0.083148, y: 0.062948}

# Axes are in the leg frame (x outward, z up), the same on all six legs. effort and velocity: MG996R at 6.0 V.
joints:
  coxa:
    axis: [0, 0, 1]
    lower: -0.959931
    upper: 0.959931
    lower_deg: -55.0
    upper_deg: 55.0
    effort: 1.0787
    velocity: 7.48
  femur:
    axis: [0, -1, 0]
    lower: -0.942478
    upper: 1.658063
    lower_deg: -54.0
    upper_deg: 95.0
    effort: 1.0787
    velocity: 7.48
  tibia:
    axis: [0, -1, 0]
    lower: -1.570796
    upper: 1.186824
    lower_deg: -90.0
    upper_deg: 68.0
    effort: 1.0787
    velocity: 7.48

# Named poses in radians [coxa, femur, tibia].
poses:
  neutral: [0.0, 0.0, 0.0]
  standby: [0.0, 0.806863, -0.53702]
  laydown: [0.0, 1.343804, -0.665964]

# Joint angle (deg) when the servo is at its centre pulse. For the hardware interface.
servo_center_deg: {coxa: 0.0, femur: 35.2, tibia: -21.4}

# Sources and conflicts: docs/robot_parameters.md.
servo:
  model: MG996R
  mass: 0.055
  stall_torque_4v8: 0.9218
  stall_torque_6v: 1.0787
  speed_4v8: 6.16
  speed_6v: 7.48
  stall_current_6v: 2.5
  running_current_6v: [0.5, 0.9]
  travel_deg: 180

