# Single source of truth for the hexapod model: hexapod_description, the kinematics library and the RL environment.
# Generated by scripts/generate_model.py. Provenance of every number: docs/robot_parameters.md.

# Identity. RookiDroid "Mochi" variant: the MG92B build in the repo. SI units, radians.
robot: {name: hexapod, variant: rookidroid_mochi, source_commit: 625d150e0d0315bf6a364b36b8aa8332ec558935}

# MEASURED from STL. base_link: x forward, y left, z up, origin under the body centre at the base underside.
body: {hip_radius: 0.0818, hip_z: 0.020765, arm_height: 0.0288, across_arm_tips: 0.1836, across_flats: 0.16726,
  body_height: 0.0898}

# MEASURED from STL. coxa/femur match mochi.json; tibia differs by 1.76 mm (mochi.json 0.08522).
leg_geometry: {coxa_length: 0.036, femur_length: 0.0436, tibia_length: 0.08346, foot_lateral_offset_not_modelled: -0.00102}

# Leg order follows mochi.json. mirror: right +1, left -1.
legs:
- {id: 1, name: front_right, side: right, mirror: 1, yaw: -0.523599, yaw_deg: -30.0, x: 0.070841, y: -0.0409}
- {id: 2, name: center_right, side: right, mirror: 1, yaw: -1.570796, yaw_deg: -90.0, x: 0.0, y: -0.0818}
- {id: 3, name: rear_right, side: right, mirror: 1, yaw: -2.617994, yaw_deg: -150.0, x: -0.070841, y: -0.0409}
- {id: 4, name: front_left, side: left, mirror: -1, yaw: 0.523599, yaw_deg: 30.0, x: 0.070841, y: 0.0409}
- {id: 5, name: center_left, side: left, mirror: -1, yaw: 1.570796, yaw_deg: 90.0, x: 0.0, y: 0.0818}
- {id: 6, name: rear_left, side: left, mirror: -1, yaw: 2.617994, yaw_deg: 150.0, x: -0.070841, y: 0.0409}

# Axes are in the leg frame (x outward, z up), the same for all six legs. Limits: see docs/robot_parameters.md.
# effort and velocity: MG92B datasheet at 6.0 V (stall torque, no-load speed).
joints:
  coxa:
    axis: [0, 0, 1]
    lower: -0.785398
    upper: 0.785398
    lower_deg: -45
    upper_deg: 45
    effort: 0.3432
    velocity: 13.09
  femur:
    axis: [0, -1, 0]
    lower: -1.308997
    upper: 1.308997
    lower_deg: -75
    upper_deg: 75
    effort: 0.3432
    velocity: 13.09
  tibia:
    axis: [0, -1, 0]
    lower: -0.872665
    upper: 1.308997
    lower_deg: -50
    upper_deg: 75
    effort: 0.3432
    velocity: 13.09

# Named poses in radians [coxa, femur, tibia]. standby and laydown are converted from mochi.json postures.
poses:
  neutral: [0.0, 0.0, 0.0]
  standby: [0.0, 0.523599, -0.261799]
  laydown: [0.0, 1.134464, 0.0]

# Datasheet values. Sources and conflicts: docs/robot_parameters.md.
