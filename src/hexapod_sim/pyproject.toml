[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hexapod-sim"
version = "0.1.0"
description = "Browser simulator for the hexapod: FK, body pose IK, leg patterns and gait playback"
requires-python = ">=3.10"
dependencies = ["hexapod-kinematics", "numpy", "trimesh", "viser>=1.1,<2"]
license = { text = "GPL-3.0-only" }

[tool.setuptools]
packages = ["hexapod_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
